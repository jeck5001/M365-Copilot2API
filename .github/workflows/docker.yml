name: Docker Build

# Build the amd64 Docker image and push it to GHCR (ghcr.io) on every push
# to main. The NAS pulls this image with docker-compose instead of building
# locally.
#
# NOTE: ghcr.io packages default to private. To let the NAS pull without
# credentials, open the package and change its visibility to Public:
#   GitHub -> your avatar -> Packages -> <package> -> Package settings
on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; github.repository is AUTHOR/REPO.
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo ${IMAGE_NAME} | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Compute tags
        id: tags
        run: |
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          TAGS="${REGISTRY}/${IMAGE_NAME_LOWER}:${BRANCH_TAG},${REGISTRY}/${IMAGE_NAME_LOWER}:${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME_LOWER}:latest"
          fi
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}