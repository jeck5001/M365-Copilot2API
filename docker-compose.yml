services:
  m365-copilot2api:
    build: .
    image: m365-copilot2api:latest
    container_name: m365-copilot2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"
    environment:
      # Log timestamps in local time. The image also ships tzdata and this
      # default, so overriding TZ here is enough to move the container clock.
      TZ: "${TZ:-Asia/Shanghai}"
      M365_LISTEN: 0.0.0.0:4141
      M365_DATA_DIR: /data
      M365_CONFIG: /data/accounts.json
      M365_TOKEN_CACHE: /data/token-cache.json
      M365_SESSION_CACHE: /data/sessions.json
      M365_API_KEYS: /data/api-keys.json
      M365_ADMIN_PASSWORD_FILE: /data/admin-password
      M365_ADMIN_PASSWORD_BOOTSTRAP_FILE: /run/secrets/m365_admin_password
      M365_CHAT_TIMEOUT_SECONDS: "120"
      M365_IMAGE_TIMEOUT_SECONDS: "150"
      # Raw ChatHub frame capture, off unless a path is given. Set it to a path
      # under /data so the file lands in ./data on the host:
      #   M365_CHATHUB_DUMP_FRAMES=/data/frames.jsonl docker compose up -d
      # Frames contain answer text, so leave this unset for normal runs.
      M365_CHATHUB_DUMP_FRAMES: "${M365_CHATHUB_DUMP_FRAMES:-}"
    volumes:
      - ./data:/data
      - ./secrets/m365_admin_password:/run/secrets/m365_admin_password:ro
